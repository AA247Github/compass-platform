# Declarative Automation Bundle (formerly Databricks Asset Bundle).  [SCAFFOLD - Step 9a]
#
# WHAT IT IS: the job, written as code. `databricks bundle deploy` uploads
# src/, config/ and notebooks/ and creates the job in resources/*.yml.
# The workspace comes from DATABRICKS_HOST (CI) or your ~/.databrickscfg
# profile (laptop), so a rebuilt workspace needs no edit here.
#
# YAML SYNTAX REMINDER: indentation (spaces, never tabs) is meaning.
#   key: value          a setting
#   key:                a group; the indented lines below belong to it
#     - item            a list item
#   ${var.name}         a bundle variable, filled in at deploy time
#
# TODO (Month 2 Step 9a) - write these four top-level blocks:
#
# bundle:
#   name: compass
#
# include:
#   - resources/*.yml            # pulls in the job definition
#
# variables:
#   alert_email:                 # who gets failure emails
#     default: <your email>
#   # (Month 3 adds warehouse_id here, looked up by warehouse NAME)
#
# targets:
#   dev:
#     mode: development          # prefixes job names with [dev you]; PAUSES schedules
#     default: true
#   prod:
#     mode: production           # schedules run; deploy only from CI on main
#
# Check: `databricks bundle validate` prints no errors.
